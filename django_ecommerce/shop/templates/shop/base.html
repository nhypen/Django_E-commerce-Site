<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Django E-commerce Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 15px;
            margin-bottom: 25px;
        }

        header a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .price {
            font-weight: bold;
            color: green;
        }

        button, .btn {
            background: #222;
            color: white;
            padding: 8px 12px;
            border: none;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input {
            padding: 7px;
            margin-bottom: 10px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td, th {
            border-bottom: 1px solid #ddd;
            padding: 10px;
        }
    </style>
</head>
<body>

<header>
    <a href="{% url 'product_list' %}">Sklep</a>
    <a href="{% url 'cart_detail' %}">Koszyk</a>
</header>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
